version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.0
  aws-sam: circleci/aws-sam-serverless@5.0

workflows:
  # Development pipeline - runs on all branches except main
  dev-pipeline:
    jobs:
      - build-and-deploy-backend:
          name: deploy-backend-dev
          stage: dev
          filters:
            branches:
              ignore: main
      - build-and-deploy-frontend:
          name: deploy-frontend-dev
          stage: dev
          requires:
            - deploy-backend-dev
          filters:
            branches:
              ignore: main

  # Production pipeline - runs only on main branch
  prod-pipeline:
    jobs:
      - build-and-deploy-backend:
          name: deploy-backend-prod
          stage: prod
          filters:
            branches:
              only: main
      - build-and-deploy-frontend:
          name: deploy-frontend-prod
          stage: prod
          requires:
            - deploy-backend-prod
          filters:
            branches:
              only: main

commands:
  resolve-stage-env:
    description: >
      Resolve per-stage environment variables into fixed names used by the
      rest of the job. AWS_ROLE_ARN_<STAGE> is required (OIDC role to assume);
      ARTIFACTS_BUCKET_<STAGE> is optional and falls back to a derived name.
    parameters:
      stage:
        type: string
    steps:
      - run:
          name: Resolve stage environment
          command: |
            set -euo pipefail
            STAGE="<< parameters.stage >>"
            STAGE_UPPER=$(echo "$STAGE" | tr '[:lower:]' '[:upper:]')

            # Required: OIDC role ARN for this stage. Fail fast if unset.
            ROLE_VAR="AWS_ROLE_ARN_${STAGE_UPPER}"
            ROLE_ARN="${!ROLE_VAR:-}"
            if [ -z "$ROLE_ARN" ]; then
              echo "ERROR: $ROLE_VAR is not set. Configure the per-stage OIDC role ARN in CircleCI project/context settings."
              exit 1
            fi

            # Optional: artifacts bucket; fall back to the plumbing-stack naming convention.
            BUCKET_VAR="ARTIFACTS_BUCKET_${STAGE_UPPER}"
            ARTIFACTS_BUCKET="${!BUCKET_VAR:-msd-artifacts-circleci-${STAGE}}"

            echo "export AWS_ROLE_ARN='${ROLE_ARN}'" >> "$BASH_ENV"
            echo "export ARTIFACTS_BUCKET='${ARTIFACTS_BUCKET}'" >> "$BASH_ENV"
            echo "export STACK_NAME='msd-${STAGE}'" >> "$BASH_ENV"

            echo "Stage:            ${STAGE}"
            echo "Role ARN:         ${ROLE_ARN}"
            echo "Artifacts bucket: ${ARTIFACTS_BUCKET}"
            echo "Stack name:       msd-${STAGE}"

jobs:
  build-and-deploy-backend:
    docker:
      - image: cimg/python:3.14
    parameters:
      stage:
        type: string
    environment:
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - checkout
      - run:
          name: Resolve real Python path for SAM make-based layer builds
          command: |
            # SAM's CustomMakeBuilder runs the layer Makefiles in a shell where
            # the pyenv shim can't resolve its own helpers (pyenv-version-name:
            # command not found). Resolve the concrete interpreter path once and
            # export it as PYTHON so the Makefiles bypass the shim entirely.
            PY_VERSION=$(pyenv versions --bare | grep '^3\.14' | tail -1)
            if [ -z "$PY_VERSION" ]; then
              echo "ERROR: No pyenv 3.14.x found on the image."
              pyenv versions
              exit 1
            fi
            pyenv global "$PY_VERSION"
            pyenv rehash
            REAL_PYTHON=$(pyenv which python3)
            echo "Using interpreter: $REAL_PYTHON"
            "$REAL_PYTHON" --version
            echo "export PYTHON='${REAL_PYTHON}'" >> "$BASH_ENV"
      - restore_cache:
          keys:
            - sam-cache-v2-{{ .Branch }}-{{ checksum "cfn/template.yaml" }}
            - sam-cache-v2-{{ .Branch }}-
            - sam-cache-v2-
      - resolve-stage-env:
          stage: << parameters.stage >>
      - aws-cli/setup:
          role_arn: "$AWS_ROLE_ARN"
          role_session_name: "circleci-msd-<< parameters.stage >>-backend"
          region: AWS_DEFAULT_REGION
      - aws-sam/install
      - run:
          name: Ensure artifacts bucket exists
          command: |
            set -euo pipefail
            # Deploy (idempotent) the CI plumbing stack that owns the artifacts bucket.
            aws cloudformation deploy \
              --stack-name "msd-circleci-<< parameters.stage >>" \
              --template-file cfn/msd-circleci-stack.yaml \
              --parameter-overrides "ProjectName=msd" "EnvironmentName=<< parameters.stage >>" \
              --no-fail-on-empty-changeset
      - run:
          name: Validate SAM template
          command: |
            cd cfn
            sam validate --lint
            sam validate --template-file templates/lambdas.yaml --lint
            sam validate --template-file templates/ec2.yaml --lint
            sam validate --template-file templates/dynamodb.yaml --lint
            sam validate --template-file templates/cognito.yaml --lint
            sam validate --template-file templates/web.yaml --lint
      - run:
          name: Build SAM application
          no_output_timeout: 20m
          command: |
            set -e
            cd cfn
            # Force clean build by removing cache
            rm -rf .aws-sam
            sam build --parallel --no-cached
      - run:
          name: Deploy SAM application
          no_output_timeout: 30m
          command: |
            set -e
            cd cfn

            # Check if stack exists and is in a failed state
            STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")

            if [[ "$STACK_STATUS" == "UPDATE_ROLLBACK_FAILED" ]]; then
              echo "Stack is in UPDATE_ROLLBACK_FAILED state. Attempting to continue rollback..."
              aws cloudformation continue-update-rollback --stack-name "$STACK_NAME"
              aws cloudformation wait stack-rollback-complete --stack-name "$STACK_NAME"
              echo "Rollback completed successfully"
            elif [[ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]]; then
              echo "ERROR: Stack is in ROLLBACK_COMPLETE state."
              echo "Manual intervention required. Either:"
              echo "  1. Delete the stack manually if safe to do so"
              echo "  2. Fix the issue and redeploy"
              exit 1
            fi

            export AWS_S3_USE_ARN_REGION=false

            sam deploy \
              --stack-name "$STACK_NAME" \
              --resolve-s3 \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
              --parameter-overrides "ProjectName=msd EnvironmentName=<< parameters.stage >> AppValue=minecraft SupportBucketName=$ARTIFACTS_BUCKET" \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --disable-rollback &

            DEPLOY_PID=$!

            # Monitor stack events while deployment runs
            echo "Monitoring CloudFormation deployment progress..."
            while kill -0 $DEPLOY_PID 2>/dev/null; do
              aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query 'StackEvents[0:5].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                --output table 2>/dev/null || true
              sleep 60
            done

            # Wait for deployment to complete and surface its exit code
            wait $DEPLOY_PID
      - run:
          name: Get stack outputs
          command: |
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].Outputs' \
              --output table
      - run:
          name: Upload CloudWatch agent config
          command: |
            set -euo pipefail
            if [ -f "cloudwatch/amazon-cloudwatch-agent.json" ]; then
              echo "Uploading CloudWatch agent config to s3://$ARTIFACTS_BUCKET/"
              aws s3 cp cloudwatch/amazon-cloudwatch-agent.json "s3://$ARTIFACTS_BUCKET/amazon-cloudwatch-agent.json"
            fi
      - save_cache:
          key: sam-cache-v2-{{ .Branch }}-{{ checksum "cfn/template.yaml" }}
          paths:
            - ~/.aws-sam
            - cfn/.aws-sam

  build-and-deploy-frontend:
    docker:
      - image: cimg/node:20.18
    parameters:
      stage:
        type: string
    environment:
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-{{ .Branch }}-{{ checksum "webapp/package-lock.json" }}
            - npm-cache-{{ .Branch }}-
      - resolve-stage-env:
          stage: << parameters.stage >>
      - aws-cli/setup:
          role_arn: "$AWS_ROLE_ARN"
          role_session_name: "circleci-msd-<< parameters.stage >>-frontend"
          region: AWS_DEFAULT_REGION
      - run:
          name: Generate .env from stack outputs
          command: |
            set -e
            chmod +x support_tasks/create-env-from-cfn-stack.sh
            ./support_tasks/create-env-from-cfn-stack.sh "$STACK_NAME" "${AWS_DEFAULT_REGION}"
      - run:
          name: Build frontend
          command: |
            set -e
            cd webapp
            npm ci
            npm run build
      - run:
          name: Deploy to S3 and invalidate CloudFront
          command: |
            set -euo pipefail

            # Resolve the frontend bucket + CloudFront distribution from the app
            # stack outputs (created by cfn/templates/web.yaml).
            BUCKET_NAME=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='WebAppBucket'].OutputValue" \
              --output text)
            CLOUDFRONT_ID=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='CloudFront'].OutputValue" \
              --output text)

            if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
              echo "ERROR: Could not resolve WebAppBucket from stack $STACK_NAME outputs."
              exit 1
            fi

            echo "Deploying to S3 bucket: $BUCKET_NAME"
            aws s3 sync webapp/dist/ "s3://$BUCKET_NAME" --delete

            if [ -n "$CLOUDFRONT_ID" ] && [ "$CLOUDFRONT_ID" != "None" ]; then
              echo "Invalidating CloudFront distribution: $CLOUDFRONT_ID"
              aws cloudfront create-invalidation \
                --distribution-id "$CLOUDFRONT_ID" \
                --paths "/*"
            fi
      - save_cache:
          key: npm-cache-{{ .Branch }}-{{ checksum "webapp/package-lock.json" }}
          paths:
            - ~/.npm
