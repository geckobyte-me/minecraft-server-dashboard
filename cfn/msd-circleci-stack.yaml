AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD artifacts bucket for CircleCI build/deploy pipelines

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project
  EnvironmentName:
    Type: String
    Description: Name of the environment

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    # Retain on stack delete so pipeline artifacts (lambda zips, nested
    # templates, db scripts) are never lost by tearing down this CI-plumbing stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-circleci-${EnvironmentName}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  ArtifactsBucketName:
    Description: Name of the artifacts S3 bucket
    Value: !Ref ArtifactsBucket
