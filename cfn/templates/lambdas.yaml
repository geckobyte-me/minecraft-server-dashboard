AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    AutoPublishAlias: live
    Handler: index.handler
    MemorySize: 256
    Runtime: python3.14
    Timeout: 120
    Tracing: Active
    Environment:
      Variables:
        CORE_TABLE_NAME:
          Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTableName"
        COGNITO_USER_POOL_ID:
          Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-UserPoolId"
        TAG_APP_VALUE: !Ref AppValue
        APP_NAME: !Ref ProjectName
        ENVIRONMENT_NAME: !Ref EnvironmentName
        AWS_REGION_NAME: !Sub "${AWS::Region}"

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
  AppValue:
    Type: String
  IAMEC2RoleArn:
    Type: String
    Description: IAM EC2 Role ARN
  IAMEC2InstanceProfile:
    Type: String
    Description: IAM EC2 Instance Profile Name
  IAMEC2InstanceProfileArn:
    Type: String
    Description: IAM EC2 Instance Profile ARN

Resources:

  GraphQLAPI:
    Type: AWS::Serverless::GraphQLApi
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-graphql"
      SchemaUri: ../../appsync/schema.graphql
      Auth:
        Type: "AMAZON_COGNITO_USER_POOLS"
        UserPool:
          UserPoolId:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-UserPoolId"
          AwsRegion: !Ref "AWS::Region"
          DefaultAction: ALLOW
        Additional:
          - Type: AWS_IAM
      DataSources:
        DynamoDb:
          LogAuditTable:
            TableName:
              Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-LogAuditTableName"
            TableArn:
              Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-LogAuditTable"
          CoreTable:
            TableName:
              Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTable"
            TableArn:
              Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTable"
        Lambda:
          ec2DiscoveryDataSource:
            FunctionArn: !GetAtt ec2Discovery.Arn
          ec2ActionValidatorDataSource:
            FunctionArn: !GetAtt ec2ActionValidator.Arn
          iamProfileManagerDataSource:
            FunctionArn: !GetAtt iamProfileManager.Arn
          ec2MetricsHandlerDataSource:
            FunctionArn: !GetAtt ec2MetricsHandler.Arn
      Functions:
        serverListFunction:
          Runtime:
            Name: APPSYNC_JS
            Version: "1.0.0"
          DataSource: ec2DiscoveryDataSource
          CodeUri: ../../appsync/resolvers/lambdaInvoker.js
        ec2ActionValidatorFunction:
          Runtime:
            Name: APPSYNC_JS
            Version: "1.0.0"
          DataSource: ec2ActionValidatorDataSource
          CodeUri: ../../appsync/resolvers/lambdaInvoker.js
        iamProfileManagerFunction:
          Runtime:
            Name: APPSYNC_JS
            Version: "1.0.0"
          DataSource: iamProfileManagerDataSource
          CodeUri: ../../appsync/resolvers/lambdaInvoker.js
        ec2MetricsHandlerFunction:
          Runtime:
            Name: APPSYNC_JS
            Version: "1.0.0"
          DataSource: ec2MetricsHandlerDataSource
          CodeUri: ../../appsync/resolvers/lambdaInvoker.js
        putLogAuditFunction:
          Runtime:
            Name: APPSYNC_JS
            Version: "1.0.0"
          DataSource: LogAuditTable
          CodeUri: ../../appsync/resolvers/putById.js
        getLogAuditFunction:
          Runtime:
            Name: APPSYNC_JS
            Version: "1.0.0"
          DataSource: LogAuditTable
          CodeUri: ../../appsync/resolvers/getById.js
      Resolvers:
        Mutation:
          putServerConfig:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          updateServerConfig:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          startServer:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          stopServer:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          iamProfileManager:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - iamProfileManagerFunction
          addUserToServer:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          updateUserRole:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          removeUserFromServer:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          putLogAudit:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - putLogAuditFunction
          verifyUserEmail:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - getLogAuditFunction
        Query:
          ec2Discovery:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - serverListFunction
          getServerConfig:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          getServerUsers:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          getAdminUsers:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          searchUserByEmail:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          getLogAudit:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - getLogAuditFunction
          getServerUptime:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2ActionValidatorFunction
          ec2MetricsHandler:
            Runtime:
              Name: APPSYNC_JS
              Version: "1.0.0"
            Pipeline:
              - ec2MetricsHandlerFunction

  DataSourceNone:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLAPI.ApiId
      Name: dataSourceNameNone
      Description: dataSourceNone
      Type: "NONE"

  PutMetricServerResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLAPI.ApiId
      TypeName: Mutation
      FieldName: putServerMetric
      DataSourceName: !GetAtt DataSourceNone.Name
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "payload": {
              "id": $util.toJson($context.arguments.input.id),
              "cpuStats": $util.toJson($context.arguments.input.cpuStats),
              "networkStats": $util.toJson($context.arguments.input.networkStats),
              "memStats": $util.toJson($context.arguments.input.memStats)
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  ChangeServerStateResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLAPI.ApiId
      TypeName: Mutation
      FieldName: changeServerState
      DataSourceName: !GetAtt DataSourceNone.Name
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "payload": {
              "id": $util.toJson($context.arguments.input.id),
              "name": $util.toJson($context.arguments.input.name),
              "type": $util.toJson($context.arguments.input.type),
              "userEmail": $util.toJson($context.arguments.input.userEmail),
              "state": $util.toJson($context.arguments.input.state),
              "vCpus": $util.toJson($context.arguments.input.vCpus),
              "memSize": $util.toJson($context.arguments.input.memSize),
              "diskSize": $util.toJson($context.arguments.input.diskSize),
              "launchTime": $util.toJson($context.arguments.input.launchTime),
              "publicIp": $util.toJson($context.arguments.input.publicIp),
              "iamStatus": $util.toJson($context.arguments.input.iamStatus)
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  PutActionStatusResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLAPI.ApiId
      TypeName: Mutation
      FieldName: putec2ActionValidatorStatus
      DataSourceName: !GetAtt DataSourceNone.Name
      RequestMappingTemplate: |
        {
          "version" : "2017-02-28",
          "payload": {
              "id": $util.toJson($context.arguments.input.id),
              "action": $util.toJson($context.arguments.input.action),
              "status": $util.toJson($context.arguments.input.status),
              "timestamp": $util.toJson($context.arguments.input.timestamp),
              "message": $util.toJson($context.arguments.input.message),
              "userEmail": $util.toJson($context.arguments.input.userEmail)
          }
        }
      ResponseMappingTemplate: $util.toJson($ctx.result)

  ScheduledRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-ec2StateScheduledRule"
      Description: "ScheduledRule"
      ScheduleExpression: "rate(2 minutes)"
      State: "DISABLED"
      Targets:
        -
          Arn: !GetAtt ec2StateHandler.Arn
          Id: "ec2StateHandlerV1"

  PermissionForEventsToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref "ec2StateHandler"
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn:
        !GetAtt ScheduledRule.Arn

  AuthLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: MinecraftDashboardHelper
      ContentUri: ../../layers/authHelper/
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  DdbLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: MinecraftDashboardHelpers
      ContentUri: ../../layers/ddbHelper/
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  UtilLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: MinecraftDashboardHelper
      ContentUri: ../../layers/utilHelper/
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  Ec2Layer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: MinecraftDashboardHelpers
      ContentUri: ../../layers/ec2Helper/
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  ec2StateHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-ec2StateHandler"
      CodeUri: ../../lambdas/ec2StateHandler/
      Layers:
        - !Ref AuthLayer
        - !Ref DdbLayer
        - !Ref UtilLayer
        - !Ref Ec2Layer
      Events:
        EC2StateTrigger:
          Type: CloudWatchEvent
          Properties:
            Pattern:
              source:
                - aws.ec2
              detail-type:
                - EC2 Instance State-change Notification
      Policies:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonCognitoReadOnly
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - appsync:ListGraphqlApis
                - appsync:GetGraphqlApi
                - appsync:GraphQL
              Resource: '*'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - events:ListRules
                - events:DescribeRule
                - events:DisableRule
                - events:EnableRule
              Resource: "*"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTable"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-LogAuditTable"
      Environment:
        Variables:
          SCHEDULED_RULE_NAME: !Sub "${ProjectName}-${EnvironmentName}-ec2StateScheduledRule"
          APPSYNC_URL: !GetAtt GraphQLAPI.GraphQLUrl
          COGNITO_USER_POOL_ID:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-UserPoolId"
          CORE_TABLE_NAME:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTableName"
          LOG_AUDIT_TABLE_NAME:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-LogAuditTableName"

  ec2MetricsHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-ec2MetricsHandler"
      CodeUri: ../../lambdas/ec2MetricsHandler/
      Layers:
        - !Ref AuthLayer
        - !Ref UtilLayer
      Policies:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess

  ec2Discovery:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-ec2Discovery"
      CodeUri: ../../lambdas/ec2Discovery/
      Layers:
        - !Ref AuthLayer
        - !Ref Ec2Layer
        - !Ref DdbLayer
      Policies:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonCognitoReadOnly
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTable"

  ec2ActionValidator:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 60
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-ec2ActionValidator"
      CodeUri: ../../lambdas/ec2ActionValidator/
      Layers:
        - !Ref AuthLayer
        - !Ref UtilLayer
        - !Ref Ec2Layer
        - !Ref DdbLayer
      Policies:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonCognitoReadOnly
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTable"
                - Fn::Sub:
                    - "${CoreTable}/index/*"
                    - CoreTable:
                        Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-CoreTable"
                - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-LogAuditTable"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:CreateGroup
                - cognito-idp:AdminAddUserToGroup
              Resource: "*"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ec2:StartInstances
                - ec2:StopInstances
                - ec2:CreateTags
              Resource: 'arn:aws:ec2:*:*:instance/*'
              Condition:
                StringEquals:
                  'ec2:ResourceTag/App': !Ref AppValue
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ProjectName}-${EnvironmentName}/*"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvironmentName}-scheduler-exec"
              Condition:
                StringEquals:
                  "iam:PassedToService": scheduler.amazonaws.com
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricAlarm
                - cloudwatch:DeleteAlarms
                - cloudwatch:DescribeAlarms
              Resource: "*"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - appsync:GraphQL
              Resource: !Sub "${GraphQLAPI.Arn}/*"
      Environment:
        Variables:
          EC2_INSTANCE_PROFILE_NAME:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-IAMEC2InstanceProfile"
          EC2_INSTANCE_PROFILE_ARN:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-IAMEC2InstanceProfileArn"
          APPSYNC_URL: !GetAtt GraphQLAPI.GraphQLUrl
          COGNITO_USER_POOL_ID:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-UserPoolId"
          LOG_AUDIT_TABLE_NAME:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-LogAuditTableName"
          SCHEDULER_ROLE_ARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvironmentName}-scheduler-exec"
          SCHEDULER_GROUP_NAME: !Ref ScheduleGroup

  # EventBridge Scheduler group that holds the per-instance start/stop schedules
  # created at runtime by ec2ActionValidator.
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}"

  # Execution role assumed by EventBridge Scheduler to invoke ec2ActionValidator
  # when a start/stop schedule fires.
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-scheduler-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-ec2-action-validator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${EnvironmentName}-ec2ActionValidator"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${EnvironmentName}-ec2ActionValidator:*"

  PermissionForSchedulerToInvokeec2ActionValidator:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ec2ActionValidator
      Action: "lambda:InvokeFunction"
      Principal: "scheduler.amazonaws.com"
      SourceAccount: !Ref AWS::AccountId

  iamProfileManager:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 120
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-iamProfileManager"
      CodeUri: ../../lambdas/iamProfileManager/
      Layers:
        - !Ref AuthLayer
        - !Ref UtilLayer
        - !Ref Ec2Layer
      Policies:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonCognitoReadOnly
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ec2:AssociateIamInstanceProfile
                - ec2:DisassociateIamInstanceProfile
              Resource: 'arn:aws:ec2:*:*:instance/*'
              Condition:
                StringEquals:
                  'ec2:ResourceTag/App': !Ref AppValue
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !Ref IAMEC2RoleArn
      Environment:
        Variables:
          EC2_INSTANCE_PROFILE_NAME: !Ref IAMEC2InstanceProfile
          EC2_INSTANCE_PROFILE_ARN: !Ref IAMEC2InstanceProfileArn
          COGNITO_USER_POOL_ID:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-UserPoolId"

Outputs:
  GraphQLAPIEndpoint:
    Value: !GetAtt GraphQLAPI.GraphQLUrl
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-GraphQLAPIEndpoint"

  GraphQLAPIId:
    Value: !GetAtt GraphQLAPI.ApiId
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-GraphQLAPIId"

  ec2MetricsHandler:
    Value: !GetAtt ec2MetricsHandler.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-ec2MetricsHandler"

  ec2Discovery:
    Value: !GetAtt ec2Discovery.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-ec2Discovery"

  ec2ActionValidator:
    Value: !GetAtt ec2ActionValidator.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-ec2ActionValidator"

  iamProfileManager:
    Value: !GetAtt iamProfileManager.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-iamProfileManager"

  ec2StateHandler:
    Value: !GetAtt ec2StateHandler.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-ec2StateHandler"
